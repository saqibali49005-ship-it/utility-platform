<script src="tools-data.js"></script><script>
(function(){
 const tools=window.UTILITY_TOOLS||[], cats=window.UTILITY_CATEGORIES||[], map=Object.fromEntries(cats.map(c=>[c.id,c]));
 const params=new URLSearchParams(location.search); let active=params.get('category')||''; let query=params.get('q')||'';
 const input=document.getElementById('dir-input'), filters=document.getElementById('filters'), grid=document.getElementById('directory-grid'), count=document.getElementById('count'), empty=document.getElementById('empty');
 input.value=query;
 function matches(t,q){return [t.title,t.description,t.category,...(t.keywords||[])].join(' ').toLowerCase().includes(q.toLowerCase());}
 function renderFilters(){filters.innerHTML='<button class="filter '+(!active?'active':'')+'" data-cat="">All tools</button>'+cats.map(c=>'<button class="filter '+(active===c.id?'active':'')+'" data-cat="'+c.id+'"><span class="filter-icon" aria-hidden="true">'+c.icon+'</span><span>'+c.title+'</span></button>').join('');}
 function render(){const q=input.value.trim().toLowerCase(); let list=tools.slice().sort((a,b)=>(b.addedOrder||0)-(a.addedOrder||0)); if(active)list=list.filter(t=>t.category===active); if(q)list=list.filter(t=>matches(t,q)); count.textContent=list.length+' '+(list.length===1?'tool':'tools')+' shown'; grid.innerHTML=list.map(t=>{const c=map[t.category];return '<article class="dir-card"><span class="tag">'+(c?c.title:'Tools')+'</span><h2>'+t.title+'</h2><p>'+t.description+'</p><a href="'+t.href+'">Open tool</a></article>';}).join(''); empty.hidden=list.length!==0; renderFilters();}
 document.getElementById('dir-search').addEventListener('submit',e=>{e.preventDefault();query=input.value;history.replaceState(null,'','tools.html?'+new URLSearchParams({q:query,...(active?{category:active}:{})}).toString());render();});
 filters.addEventListener('click',e=>{const btn=e.target.closest('[data-cat]');if(!btn)return;active=btn.dataset.cat;const p=new URLSearchParams();if(input.value.trim())p.set('q',input.value.trim());if(active)p.set('category',active);history.replaceState(null,'','tools.html'+(p.toString()?'?'+p.toString():''));render();});
 input.addEventListener('input',render);
 render();
})();
</script></body></html>
