<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Significant Figures Calculator</title>

  <meta
    name="description"
    content="Count significant figures in numbers quickly and accurately."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #172033;
    }

    .container {
      width: min(700px, 92%);
      margin: 50px auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .intro {
      text-align: center;
      color: #5f6b7a;
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #ccd3dd;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      background: #172033;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      background: #f0f4f8;
      border-radius: 10px;
      display: none;
    }

    .result-number {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .explanation {
      margin-top: 15px;
      line-height: 1.6;
    }

    .error {
      color: #b42318;
      margin-top: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Significant Figures Calculator</h1>

    <p class="intro">
      Count the significant figures in any number quickly and clearly.
    </p>

    <section class="card">

      <label for="numberInput">Enter a number</label>

      <input
        id="numberInput"
        type="text"
        placeholder="Example: 0.004560"
        autocomplete="off"
      >

      <button onclick="calculateSigFigs()">
        Calculate
      </button>

      <p id="error" class="error">
        Please enter a valid number.
      </p>

      <div id="result" class="result">

        <div>Significant Figures:</div>

        <div id="resultNumber" class="result-number"></div>

        <div id="explanation" class="explanation"></div>

      </div>

    </section>

  </main>

  <script>
    function countSignificantFigures(value) {

      value = value.trim();

      if (!value) {
        return null;
      }

      // Remove positive or negative sign
      value = value.replace(/^[+-]/, "");

      // Check scientific notation
      const scientificParts = value.split(/[eE]/);

      if (scientificParts.length > 2) {
        return null;
      }

      let base = scientificParts[0];

      // Validate the base number
      if (!/^\d*\.?\d+$/.test(base)) {
        return null;
      }

      // Scientific notation
      if (scientificParts.length === 2) {

        const exponent = scientificParts[1];

        if (!/^[+-]?\d+$/.test(exponent)) {
          return null;
        }

        // In scientific notation, every digit in
        // the mantissa is significant.
        const digits = base.replace(".", "");

        // Example: 0e3 = 1 significant figure
        if (/^0+$/.test(digits)) {
          return 1;
        }

        return digits.length - (digits.match(/^0+/) || [""])[0].length;
      }

      // Numbers containing a decimal point
      if (base.includes(".")) {

        const digits = base.replace(".", "");

        // All-zero decimal values:
// 0.0 = 1, 0.00 = 2, 0.000 = 3
if (/^0+$/.test(digits)) {
  const decimalPlaces = base.split(".")[1].length;
  return Math.max(1, decimalPlaces);
}

        // Remove leading zeros
        const significantDigits = digits.replace(/^0+/, "");

        return significantDigits.length;
      }

      // Whole number
      const withoutLeadingZeros = base.replace(/^0+/, "");

      // Zero itself = 1 significant figure
      if (withoutLeadingZeros === "") {
        return 1;
      }

      // Trailing zeros in a whole number are ambiguous
      if (/0+$/.test(withoutLeadingZeros)) {
        return "ambiguous";
      }

      return withoutLeadingZeros.length;
    }

    function calculateSigFigs() {

      const input = document.getElementById("numberInput").value;
      const error = document.getElementById("error");
      const result = document.getElementById("result");
      const resultNumber = document.getElementById("resultNumber");
      const explanation = document.getElementById("explanation");

      const count = countSignificantFigures(input);

      if (count === null) {
        error.style.display = "block";
        result.style.display = "none";
        return;
      }

      error.style.display = "none";
      result.style.display = "block";

      if (count === "ambiguous") {

        resultNumber.textContent = "Ambiguous";

        explanation.innerHTML =
          "Trailing zeros in a whole number without a decimal point " +
          "or scientific notation may be ambiguous.<br><br>" +
          "For example:<br>" +
          "1.2 × 10³ = 2 significant figures<br>" +
          "1.20 × 10³ = 3 significant figures<br>" +
          "1.200 × 10³ = 4 significant figures";

        return;
      }

      resultNumber.textContent = count;

      explanation.innerHTML =
        "This number contains <strong>" +
        count +
        "</strong> significant figure" +
        (count === 1 ? "" : "s") +
        ".";
    }
  </script>

</body>
</html>
