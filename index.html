<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Significant Figures Calculator – Count & Round</title>

  <meta
    name="description"
    content="Count significant figures and round numbers to a chosen number of significant figures. Free calculator for decimals, whole numbers, and scientific notation."
  >

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      line-height: 1.6;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .intro {
      text-align: center;
      margin-bottom: 25px;
    }

    .intro h2 {
      font-size: 30px;
      margin-bottom: 10px;
      color: #111827;
    }

    .intro p {
      color: #6b7280;
      margin: 0 auto;
      max-width: 650px;
    }

    .calculator-card {
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      margin-bottom: 25px;
    }

    .mode-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 22px;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .mode-button {
      margin-top: 0;
      background: #e5e7eb;
      color: #111827;
    }

    .mode-button.active {
      background: #2563eb;
      color: white;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    .target-group {
      margin-top: 18px;
      display: none;
    }

    .result {
      margin-top: 20px;
      padding: 18px;
      border-radius: 10px;
      background: #f3f4f6;
      text-align: center;
      display: none;
    }

    .result-number {
      font-size: 32px;
      font-weight: bold;
      color: #111827;
      word-break: break-word;
    }

    .result-label {
      color: #6b7280;
      margin-top: 4px;
    }
