name: UUID Related Tools Final Mobile Fix

on:
  push:
    paths:
      - '.github/workflows/uuid-related-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UUID-only mobile layout fix
        run: |
          cat >> site-design.css <<'EOF'

/* UUID-only Related Tools final layout repair: flex text flow prevents direct-text grid overlap. */
main.wrap:has(> .crumbs > a[href="digital-developer.html"]) > section.card:last-of-type:has(a[href="pilot-hole-calculator.html"]) p>a{
  display:flex!important;
  align-items:center!important;
  position:relative!important;
  flex:1 1 calc(50% - 5px)!important;
  width:auto!important;
  min-width:0!important;
  min-height:76px!important;
  box-sizing:border-box!important;
  margin:0!important;
  padding:10px 44px 10px 76px!important;
  border:1px solid #dbe3ed!important;
  border-radius:14px!important;
  background:#fff!important;
  color:var(--up-text)!important;
  text-decoration:none!important;
  font-size:14px!important;
  line-height:1.3!important;
  font-weight:800!important;
  box-shadow:0 4px 14px rgba(15,23,42,.045)!important;
  overflow:hidden!important;
}
main.wrap:has(> .crumbs > a[href="digital-developer.html"]) > section.card:last-of-type:has(a[href="pilot-hole-calculator.html"]) p>a::before{
  position:absolute!important;
  left:12px!important;
  top:50%!important;
  transform:translateY(-50%)!important;
  width:50px!important;
  height:50px!important;
  display:grid!important;
  place-items:center!important;
  border-radius:14px!important;
  font-size:23px!important;
  line-height:1!important;
  font-weight:700!important;
  box-sizing:border-box!important;
}
main.wrap:has(> .crumbs > a[href="digital-developer.html"]) > section.card:last-of-type:has(a[href="pilot-hole-calculator.html"]) p>a::after{
  content:"›"!important;
  position:absolute!important;
  right:12px!important;
  top:50%!important;
  transform:translateY(-52%)!important;
  font-size:30px!important;
  line-height:1!important;
  font-weight:300!important;
  color:#0f172a!important;
}
main.wrap:has(> .crumbs > a[href="digital-developer.html"]) > section.card:last-of-type:has(a[href="pilot-hole-calculator.html"]) p>a[href="pilot-hole-calculator.html"]::before{
  content:"⌁"!important;
  color:#c2410c!important;
  background:#fff7ed!important;
}
main.wrap:has(> .crumbs > a[href="digital-developer.html"]) > section.card:last-of-type:has(a[href="pilot-hole-calculator.html"]) p>a[href="calculator.html"]::before{
  content:"▦"!important;
  color:#2563eb!important;
  background:#eff6ff!important;
}
@media(max-width:700px){
  main.wrap:has(> .crumbs > a[href="digital-developer.html"]) > section.card:last-of-type:has(a[href="pilot-hole-calculator.html"]) p>a{
    flex-basis:100%!important;
    min-height:76px!important;
    padding:10px 42px 10px 68px!important;
    border-radius:13px!important;
  }
  main.wrap:has(> .crumbs > a[href="digital-developer.html"]) > section.card:last-of-type:has(a[href="pilot-hole-calculator.html"]) p>a::before{
    left:10px!important;
    width:46px!important;
    height:46px!important;
    border-radius:13px!important;
    font-size:21px!important;
  }
  main.wrap:has(> .crumbs > a[href="digital-developer.html"]) > section.card:last-of-type:has(a[href="pilot-hole-calculator.html"]) p>a::after{
    right:10px!important;
    font-size:28px!important;
  }
}
EOF
          rm -f .github/workflows/uuid-related-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-design.css .github/workflows/uuid-related-fix.yml
          git commit -m "Fix UUID Related Tools mobile text overlap"
          git push
