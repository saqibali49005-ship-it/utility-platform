name: Fix Gravel Related Layout
on:
  push:
    paths:
      - '_gravel_related_layout_trigger.txt'

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply CSS fix
        run: sed -i 's/background:#fff7ed!important;color:#ea580c!important/background:#eff6ff!important;color:#2563eb!important/g' tool-layout.css
      - name: Add Gravel layout override
        run: printf '%s\n' '.tool-page>main#main-content>.panel:has(.related-tools){display:block!important}' '.tool-page>main#main-content>.panel.related-tools .related-grid{display:grid!important;grid-template-columns:1fr!important;gap:12px!important;margin-top:14px!important}' '.tool-page>main#main-content>.panel.related-tools .related-item{display:flex!important;align-items:center!important;gap:12px!important;min-height:76px!important;width:100%!important;padding:14px 16px!important;border:1px solid #dbe3ed!important;border-radius:16px!important;background:#fff!important;box-shadow:0 5px 16px rgba(15,23,42,.05)!important;color:#0b1220!important;font-weight:750!important;text-decoration:none!important}' '.tool-page>main#main-content>.panel.related-tools .related-icon{display:grid!important;place-items:center!important;flex:0 0 48px!important;width:48px!important;height:48px!important;border-radius:13px!important;background:#eff6ff!important;color:#2563eb!important;font-size:21px!important;font-weight:800!important;line-height:1!important}' '.tool-page>main#main-content>.panel.related-tools .related-copy{display:block!important;min-width:0!important;flex:1 1 auto!important}' '.tool-page>main#main-content>.panel.related-tools .related-copy strong{display:block!important;line-height:1.25!important}' '.tool-page>main#main-content>.panel.related-tools .related-copy small{display:block!important;margin-top:3px!important;color:#5f6b7a!important;font-size:.82rem!important;font-weight:500!important;line-height:1.35!important}' '.tool-page>main#main-content>.panel.related-tools .related-arrow{display:block!important;flex:0 0 auto!important;margin-left:auto!important;font-size:28px!important;font-weight:300!important;color:#0f172a!important;line-height:1!important}' >> gravel-calculator.html
      - name: Commit fix
        run: |
          rm -f _gravel_related_layout_trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gravel-calculator.html tool-layout.css _gravel_related_layout_trigger.txt
          git commit -m 'Fix gravel related tools layout [skip gravel-related-layout]'
          git push
