name: Fix Calculator Master Design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Gravel master design overrides
        shell: python
        run: |
          from pathlib import Path
          p = Path('calculator.html')
          s = p.read_text(encoding='utf-8')
          start = '<style id="calculator-master-override">'
          end = '</style>'
          if start in s:
              a = s.index(start)
              b = s.index(end, a) + len(end)
              s = s[:a] + s[b:]
          css = r'''<style id="calculator-master-override">
/* Gravel Calculator master parity — Significant Figures */
body.tool-page .mode-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px!important;margin:0 0 18px!important}
body.tool-page .mode-btn{min-height:46px!important;border:1px solid #d9dee6!important;border-radius:10px!important;background:#fff!important;color:#111827!important;padding:10px 12px!important;font-weight:800!important;box-shadow:none!important}
body.tool-page .mode-btn.active{background:#111827!important;color:#fff!important;border-color:#111827!important}
body.tool-page .field{margin:0 0 16px!important}
body.tool-page .input-wrap input{min-height:46px!important;border:1px solid #cbd2dc!important;border-radius:10px!important;padding:10px 12px!important;background:#fff!important}
body.tool-page .primary{width:100%!important;min-height:46px!important;border:0!important;border-radius:10px!important;background:#111827!important;color:#fff!important;padding:12px 16px!important;font-weight:800!important}
body.tool-page .primary:hover{background:#1f2937!important}
body.tool-page .result{margin-top:16px!important;padding:16px!important;border:1px solid #d9dee6!important;border-radius:13px!important;background:#f8fafc!important;box-shadow:none!important}
body.tool-page .why{margin-top:12px!important;padding:12px 14px!important;border-left:3px solid #2563eb!important;background:#fff!important;border-radius:8px!important}
body.tool-page .example-list{display:grid!important;gap:10px!important;margin-top:12px!important}
body.tool-page .example{border:1px solid #d9dee6!important;border-radius:12px!important;padding:12px 13px!important;background:#fff!important;box-shadow:none!important}
body.tool-page .faq{border-top:1px solid #d9dee6!important}
body.tool-page .faq button{padding:15px 0!important;color:#111827!important}
body.tool-page .faq-answer{color:#5b6472!important}
body.tool-page .related{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:12px!important;margin-top:14px!important}
body.tool-page .related-item{min-height:76px!important;border:1px solid #dbe3ed!important;border-radius:16px!important;padding:14px!important;background:#fff!important;box-shadow:0 5px 16px rgba(15,23,42,.05)!important}
@media(min-width:620px){body.tool-page .mode-grid{grid-template-columns:repeat(4,minmax(0,1fr))!important}body.tool-page .card{padding:22px!important}}
@media(max-width:650px){body.tool-page .related{grid-template-columns:1fr!important}body.tool-page .mode-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}}
</style>'''
          s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calculator.html
          if git diff --cached --quiet; then
            echo 'No changes needed.'
          else
            git commit -m 'Fix calculator master design parity'
            git push
          fi
