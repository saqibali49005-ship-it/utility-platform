name: Standardize All Tool Headers
on:
  push:
    paths:
      - '_tool_header_sync_trigger.txt'
jobs:
  standardize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply calculator header CSS
        run: |
          cat >> site-design.css <<'CSS'

/* MASTER TOOL HEADER — calculator.html reference */
.tool-page > header.site-header,.tool-page > header:not(.site-header){width:100%!important;background:#fff!important;border-bottom:1px solid #d9dee6!important;box-shadow:none!important;backdrop-filter:none!important;position:static!important}
.tool-page > header.site-header .header-inner,.tool-page > header:not(.site-header) .header-inner{width:100%!important;max-width:980px!important;margin:0 auto!important;padding:18px 16px!important;min-height:0!important;display:block!important}
.tool-page > header .brand{width:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:10px!important;margin:0!important;padding:0!important;color:#111827!important;font-size:16px!important;line-height:1.2!important;font-weight:800!important;letter-spacing:-.2px!important;text-decoration:none!important;white-space:nowrap!important}
.tool-page > header .brand-mark{width:34px!important;height:34px!important;flex:0 0 34px!important;display:grid!important;place-items:center!important;border-radius:9px!important;background:#111827!important;color:#fff!important;font-size:17px!important;line-height:1!important;box-shadow:none!important}
.tool-page > header .top-nav,.tool-page > header .nav{width:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:18px!important;margin:0!important;padding:0 16px 16px!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;flex-wrap:wrap!important;overflow:visible!important;white-space:normal!important;font-size:14px!important;font-weight:700!important}
.tool-page > header .top-nav a,.tool-page > header .nav a{flex:0 0 auto!important;display:inline!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;color:#5b6472!important;font-size:14px!important;line-height:1.55!important;font-weight:700!important;text-decoration:none!important;white-space:nowrap!important;box-shadow:none!important}
.tool-page > header .top-nav a:hover,.tool-page > header .nav a:hover{background:transparent!important;border:0!important;color:#5b6472!important;text-decoration:underline!important;box-shadow:none!important}
.tool-page > header .top-nav a[aria-current="page"],.tool-page > header .nav a[aria-current="page"]{background:transparent!important;border:0!important;color:#5b6472!important;box-shadow:none!important}
@media(max-width:650px){.tool-page > header.site-header .header-inner,.tool-page > header:not(.site-header) .header-inner{padding:18px 16px!important}.tool-page > header .brand{font-size:16px!important}.tool-page > header .brand-mark{width:34px!important;height:34px!important;flex-basis:34px!important}.tool-page > header .top-nav,.tool-page > header .nav{justify-content:center!important;gap:14px!important;padding:0 8px 16px!important;overflow-x:auto!important;flex-wrap:nowrap!important;scrollbar-width:none!important;white-space:nowrap!important}.tool-page > header .top-nav::-webkit-scrollbar,.tool-page > header .nav::-webkit-scrollbar{display:none!important}.tool-page > header .top-nav a,.tool-page > header .nav a{font-size:14px!important}}
CSS
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site-design.css
          git diff --cached --quiet || git commit -m 'Standardize all tool page headers to calculator style'
          git push
