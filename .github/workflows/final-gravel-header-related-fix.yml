name: Final Gravel Header Related Fix
on:
  push:
    paths:
      - '_gravel_header_related_trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated Gravel header and related tools fix
        run: |
          cat >> gravel-calculator.html <<'EOF'
          <style>
          /* Gravel Calculator — final isolated header + related tools */
          body.tool-page>header{background:#fff!important;border-bottom:1px solid #dfe6ef!important}
          body.tool-page>header .header-inner{max-width:900px!important;margin:0 auto!important;padding:14px 16px 12px!important}
          body.tool-page>header .brand{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;color:#0b1220!important;font-size:19px!important;font-weight:800!important;text-decoration:none!important}
          body.tool-page>header .brand:hover{text-decoration:none!important}
          body.tool-page>header .brand-mark{width:38px!important;height:38px!important;flex:0 0 38px!important;display:grid!important;place-items:center!important;border-radius:12px!important;background:linear-gradient(135deg,#2563eb,#0ea5e9)!important;color:#fff!important;box-shadow:0 7px 18px rgba(37,99,235,.18)!important}
          body.tool-page>header .nav{display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:8px!important;margin-top:12px!important;padding:5px!important;border:1px solid #dfe6ef!important;border-radius:16px!important;background:#f8fafc!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;white-space:nowrap!important;scrollbar-width:none!important;-webkit-overflow-scrolling:touch!important}
          body.tool-page>header .nav::-webkit-scrollbar{display:none!important}
          body.tool-page>header .nav a{flex:0 0 auto!important;display:block!important;padding:10px 13px!important;border-radius:11px!important;color:#475569!important;font-size:14px!important;font-weight:750!important;text-decoration:none!important}
          body.tool-page>header .nav a:hover{background:#fff!important;color:#2563eb!important}
          body.tool-page .related-tools{display:block!important;margin-top:16px!important;margin-bottom:18px!important;padding:18px!important}
          body.tool-page .related-tools h2{margin:0 0 0!important;color:#0b1220!important}
          body.tool-page .related-tools .related-grid{display:grid!important;grid-template-columns:1fr!important;gap:12px!important;width:100%!important;margin-top:14px!important}
          body.tool-page .related-tools .related-item{position:relative!important;display:grid!important;grid-template-columns:48px minmax(0,1fr) 24px!important;align-items:center!important;column-gap:12px!important;width:100%!important;min-height:78px!important;margin:0!important;padding:12px 14px!important;border:1px solid #dbe3ed!important;border-radius:16px!important;background:#fff!important;box-shadow:0 5px 16px rgba(15,23,42,.05)!important;color:#0b1220!important;text-decoration:none!important}
          body.tool-page .related-tools .related-item .related-icon{grid-column:1!important;grid-row:1!important;width:48px!important;height:48px!important;display:grid!important;place-items:center!important;margin:0!important;border-radius:13px!important;background:#fff7ed!important;color:#ea580c!important;font-size:21px!important;font-weight:800!important}
          body.tool-page .related-tools .related-item .related-copy{grid-column:2!important;grid-row:1!important;min-width:0!important;margin:0!important;padding:0!important}
          body.tool-page .related-tools .related-item .related-copy strong{display:block!important;margin:0!important;color:#0b1220!important;font-size:16px!important;line-height:1.25!important;font-weight:800!important}
          body.tool-page .related-tools .related-item .related-copy small{display:block!important;margin:3px 0 0!important;color:#5f6b7a!important;font-size:.82rem!important;font-weight:500!important;line-height:1.35!important}
          body.tool-page .related-tools .related-item .related-arrow{grid-column:3!important;grid-row:1!important;display:block!important;margin:0!important;padding:0!important;color:#0f172a!important;font-size:30px!important;font-weight:300!important;line-height:1!important;text-align:right!important}
          body.tool-page .related-tools .related-item:hover{border-color:#bfdbfe!important;box-shadow:0 8px 18px rgba(15,23,42,.09)!important;transform:translateY(-1px)!important}
          @media(max-width:650px){
            body.tool-page>header .header-inner{padding:12px 14px 10px!important}
            body.tool-page>header .brand{font-size:18px!important}
            body.tool-page>header .nav{margin-top:10px!important}
            body.tool-page .related-tools{padding:16px!important}
          }
          </style>
          EOF
          rm -f _gravel_header_related_trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gravel-calculator.html _gravel_header_related_trigger.txt
          git commit -m 'Fix Gravel header and related tools layout [skip gravel-header-related]'
          git push
