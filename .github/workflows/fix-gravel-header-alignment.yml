name: Fix Gravel Header Alignment
on:
  push:
    paths:
      - '_gravel_header_align_trigger.txt'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply isolated header sizing and alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('gravel-calculator.html')
          s = p.read_text(encoding='utf-8')
          css = r'''<style id="gravel-header-final-size-align">
          body.tool-page>header{width:100%!important;background:#fff!important;border-bottom:1px solid #dfe6ef!important}
          body.tool-page>header .header-inner{width:100%!important;max-width:900px!important;margin:0 auto!important;padding:12px 16px 10px!important}
          body.tool-page>header .brand{width:100%!important;min-height:38px!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:10px!important;margin:0!important;padding:0!important;color:#0b1220!important;font-size:18px!important;line-height:1.2!important;font-weight:800!important;text-decoration:none!important}
          body.tool-page>header .brand-mark{width:38px!important;height:38px!important;flex:0 0 38px!important;border-radius:11px!important;display:grid!important;place-items:center!important;background:linear-gradient(135deg,#2563eb,#0ea5e9)!important;color:#fff!important;font-size:18px!important;line-height:1!important;box-shadow:0 5px 14px rgba(37,99,235,.16)!important}
          body.tool-page>header .nav{width:100%!important;max-width:100%!important;display:flex!important;align-items:center!important;justify-content:flex-start!important;gap:6px!important;margin:10px 0 0!important;padding:4px!important;border:1px solid #dfe6ef!important;border-radius:14px!important;background:#f8fafc!important;flex-wrap:nowrap!important;overflow-x:auto!important;overflow-y:hidden!important;white-space:nowrap!important;scrollbar-width:none!important;-webkit-overflow-scrolling:touch!important}
          body.tool-page>header .nav::-webkit-scrollbar{display:none!important}
          body.tool-page>header .nav a{flex:0 0 auto!important;display:block!important;padding:8px 11px!important;border-radius:10px!important;color:#475569!important;font-size:13px!important;line-height:1.2!important;font-weight:750!important;text-decoration:none!important;white-space:nowrap!important}
          body.tool-page>header .nav a:hover{background:#fff!important;color:#2563eb!important}
          @media(max-width:650px){body.tool-page>header .header-inner{padding:11px 14px 9px!important}body.tool-page>header .brand{font-size:17px!important}body.tool-page>header .brand-mark{width:36px!important;height:36px!important;flex-basis:36px!important}body.tool-page>header .nav{margin-top:9px!important;border-radius:13px!important}}
          </style>'''
          if 'id="gravel-header-final-size-align"' in s:
              import re
              s = re.sub(r'<style id="gravel-header-final-size-align">.*?</style>', css, s, flags=re.S)
          else:
              s = s.replace('</head>', css + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gravel-calculator.html
          git diff --cached --quiet || git commit -m 'Fix gravel header size and alignment'
          git push
