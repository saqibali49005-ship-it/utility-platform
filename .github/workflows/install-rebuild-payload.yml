name: Install rebuilt tool payload
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Install payload
        shell: bash
        run: |
          set -e
          test -f .rebuild-payload.b64
          base64 -d .rebuild-payload.b64 > /tmp/payload.tgz
          tar -xzf /tmp/payload.tgz
          rm -f .rebuild-payload.b64 .rebuild-trigger
          rm -f .github/workflows/rebuild-four-tools.yml .github/workflows/install-rebuild-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild four tools from locked master"
          git push origin HEAD:${{ github.head_ref }}
