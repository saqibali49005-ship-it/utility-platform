name: Rebuild four tools from locked master
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Restore and rebuild four tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          REFS = {
              'time-calculator.html': '867bbdc5cc3a5192fd1267cebd7e8119b535ade2',
              'pilot-hole-calculator.html': 'c850f0a60dd33f471687f03ba86d39ec3be7133d^',
              'gravel-calculator.html': 'b6ad8e32ceb34b2b20098d1b81f7317746355888^',
              'uuid-generator-calculator.html': '97c1929e81cac1d34673f958ec0d6efafa1d2350^',
          }

          PAGE_CSS = {
          'time-calculator.html': r''' .time-tool .mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 18px;padding:4px;background:#f7fafe;border:1px solid #e0e9f3;border-radius:14px}.time-tool .mode-tabs button{width:100%;min-height:44px;padding:9px 14px;background:transparent;color:#4e6178;border:1px solid transparent;border-radius:10px;font-weight:850;cursor:pointer}.time-tool .mode-tabs button.active{background:linear-gradient(135deg,#1767e7,#19a9e8);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(23,104,231,.18)}.time-tool .check-row{display:flex;align-items:flex-start;gap:9px;margin:14px 0 0;color:var(--muted)}.time-tool .check-row input{width:auto;min-width:16px;min-height:0;margin:3px 0 0;padding:0}.time-tool #durationPanel>.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.time-tool #addPanel>.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.time-tool .result-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:15px}.time-tool .result-grid>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.time-tool .result-grid strong{display:block;font-size:20px;margin-top:4px}.time-tool .big{font-size:28px;font-weight:900;color:#116735}@media(max-width:820px){.time-tool #addPanel>.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.time-tool .mode-tabs{grid-template-columns:1fr}.time-tool #durationPanel>.grid,.time-tool #addPanel>.grid{grid-template-columns:1fr}.time-tool .result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}''',
          'pilot-hole-calculator.html': r''' .pilot-tool .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pilot-tool .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.pilot-tool .kv div{background:#f7fbff;border:1px solid var(--line);border-radius:12px;padding:12px}.pilot-tool .note,.pilot-tool .warn{padding:13px 14px;border-radius:12px;margin-top:10px}.pilot-tool .note{border:1px solid #c9ecd8;background:#f2fff7}.pilot-tool .warn{border:1px solid #f2d28e;background:#fff9e9;color:#7a4a00}.pilot-tool .source-list{padding-left:20px}.pilot-tool .source-list li{margin:5px 0}.pilot-tool .result{background:linear-gradient(180deg,#fbfffd,#f2fff7)}@media(max-width:650px){.pilot-tool .grid,.pilot-tool .kv{grid-template-columns:1fr}}''',
          'gravel-calculator.html': r''' .gravel-tool .toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.gravel-tool .preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.gravel-tool .preset{border:1px solid #d8e5f3;background:#fff;color:#2c557e;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;cursor:pointer}.gravel-tool .section-list{display:grid;gap:12px}.gravel-tool .area-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#f7fbff}.gravel-tool .area-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.gravel-tool .area-title{font-weight:800}.gravel-tool .remove{border:1px solid #d8e5f3;background:#fff;color:var(--muted);border-radius:9px;padding:7px 9px;font-weight:800;cursor:pointer}.gravel-tool .area-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.gravel-tool .shape-extra{display:none}.gravel-tool .area-card[data-shape="circle"] .rect-only,.gravel-tool .area-card[data-shape="triangle"] .rect-only{display:none}.gravel-tool .area-card[data-shape="circle"] .circle-only,.gravel-tool .area-card[data-shape="triangle"] .triangle-only{display:block}.gravel-tool .area-card[data-shape="rectangle"] .rect-only{display:block}.gravel-tool .results{display:grid;gap:10px}.gravel-tool .result-main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.gravel-tool .result-main>.result{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.gravel-tool .result .value{font-size:24px;font-weight:900;margin-top:4px}.gravel-tool .order-box{background:#f6fbff;border:1px solid var(--line);border-radius:13px;padding:14px}.gravel-tool .order-box strong{font-size:19px}.gravel-tool .sub-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}.gravel-tool .alert{display:none;margin-top:12px;padding:11px 12px;border-radius:10px;border:1px solid #f2c46d;background:#fff8e8;color:#854d0e;font-size:14px}.gravel-tool .alert.show{display:block}.gravel-tool .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gravel-tool .formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0f172a;color:#fff;border-radius:10px;padding:12px;overflow:auto;font-size:13px}.gravel-tool .warning{font-size:13px;color:var(--muted)}@media(max-width:900px){.gravel-tool .area-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gravel-tool .result-main{grid-template-columns:repeat(2,minmax(0,1fr))}.gravel-tool .sub-results{grid-template-columns:1fr 1fr}}@media(max-width:650px){.gravel-tool .toolbar,.gravel-tool .info-grid{grid-template-columns:1fr}.gravel-tool .area-grid{grid-template-columns:1fr}.gravel-tool .result-main,.gravel-tool .sub-results{grid-template-columns:1fr 1fr}}@media(max-width:430px){.gravel-tool .result-main,.gravel-tool .sub-results{grid-template-columns:1fr}}''',
          'uuid-generator-calculator.html': r''' .uuid-tool .controls{grid-template-columns:repeat(2,minmax(0,1fr))}.uuid-tool .seg{display:flex;gap:8px;flex-wrap:wrap}.uuid-tool .seg button{border:1px solid #d8e5f3;background:#fff;color:#2c557e;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.uuid-tool .seg button.active{background:linear-gradient(135deg,#1767e7,#19a9e8);color:#fff;border-color:transparent}.uuid-tool .item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.uuid-tool .item button{min-height:40px;padding:8px 11px}.uuid-tool .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;word-break:break-all}.uuid-tool .mini{font-size:.82rem;color:var(--muted)}.uuid-tool .callout{border-left:3px solid var(--primary);padding:12px 14px;background:#f4f8fd;border-radius:8px;margin-top:14px;color:#334b67}.uuid-tool .callout.warn{border-left-color:#b45309;background:#fff8ea}.uuid-tool .status.ok{color:#168546}.uuid-tool .status.err{color:#b42318}@media(max-width:700px){.uuid-tool .controls{grid-template-columns:1fr}.uuid-tool .stats{grid-template-columns:1fr}.uuid-tool .item{align-items:stretch;flex-direction:column}.uuid-tool .item button{width:max-content}}'''
          }

          def git_show(rev, path):
              return subprocess.check_output(['git', 'show', f'{rev}:{path}'], text=True)

          calc = Path('calculator.html').read_text(encoding='utf-8')
          master_css = re.search(r'<style>(.*?)</style>', calc, re.S | re.I).group(1).strip()
          Path('master-tool-design.css').write_text(master_css + '\n', encoding='utf-8')
          Path('master-related-tools.css').write_text('''/* Utility Platform — genuine Related Tools component only. */
          body.tool-page .related-tools,body.tool-page .related{width:100%;}
          body.tool-page .related-grid{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 0;padding:0}
          body.tool-page .related-item{min-width:0;min-height:76px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 16px;border:1px solid #dbe3ed;border-radius:16px;background:#fff;color:#0b1220;text-decoration:none;box-shadow:0 5px 16px rgba(15,23,42,.05);transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease}
          body.tool-page .related-item:hover{border-color:#bfdbfe;box-shadow:0 8px 18px rgba(15,23,42,.09);transform:translateY(-1px)}
          body.tool-page .related-item strong{display:block;margin:0;color:#0b1220;font-size:16px;line-height:1.25;font-weight:800}.related-item span{display:block;margin:3px 0 0;color:#64748b;font-size:13px;line-height:1.35}
          @media(max-width:650px){body.tool-page .related-grid{grid-template-columns:1fr}.related-item{min-height:72px;padding:13px 14px}}
          @media(prefers-reduced-motion:reduce){body.tool-page .related-item{transition:none}}
          ''', encoding='utf-8')
          Path('master-ui.js').write_text('''(function(){'use strict';const m=document.getElementById('menuBtn'),n=document.getElementById('mobileNav'),s=document.getElementById('searchBtn'),p=document.getElementById('searchPanel'),i=document.getElementById('siteSearch'),f=document.getElementById('siteSearchForm');if(m&&n)m.onclick=()=>{const o=n.classList.toggle('open');m.setAttribute('aria-expanded',o)};if(s&&p)s.onclick=()=>{const o=p.classList.toggle('open');s.setAttribute('aria-expanded',o);if(o&&i)i.focus();if(n)n.classList.remove('open')};if(f&&i)f.onsubmit=e=>{e.preventDefault();const q=i.value.trim();if(q)location.href='index.html?search='+encodeURIComponent(q)}})();\n''', encoding='utf-8')
          Path('MASTER-REFERENCE.md').write_text('''# Utility Platform — Master Design Reference\n\n## Status\n**Current Master — LOCKED**\n\nThe **Significant Figures Calculator** (`calculator.html`) is the official visual reference for all Utility Platform tool pages.\n\nThe locked system defines the approved blue/white desktop and mobile language: header/navigation, search/menu controls, breadcrumbs, hero/title treatment, cards, form controls, buttons, results, educational sections, FAQ, responsive behavior and centered footer.\n\n## Architecture\n`master-tool-design.css` is the shared visual foundation. Page-specific CSS must be narrowly scoped to the tool's unique UI. Broad emergency overrides are not allowed.\n\n## Related Tools\n`master-related-tools.css` is only for genuinely related tools. Empty space is preferable to unrelated links.\n\n## Functionality\nRebuilds preserve original calculation logic, URLs, SEO metadata and core functionality.\n''', encoding='utf-8')

          HEADER = '''<a class="skip-link" href="#main-content">Skip to calculator</a>
          <header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><div class="brand-mark" aria-hidden="true">UP</div><div class="brand-copy"><strong>Utility Platform</strong><span>Smart Tools for a Smarter You</span></div></a>
          <nav class="top-nav" aria-label="Primary navigation"><a href="index.html" data-nav="home">Home</a><a href="math-science.html" data-nav="math">Math &amp; Science</a><a href="digital-developer.html" data-nav="digital">Digital &amp; Developer</a><a href="home-construction.html" data-nav="homec">Home &amp; Construction</a></nav>
          <div class="header-actions"><button class="icon-btn" id="searchBtn" type="button" aria-label="Search" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg></button><button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button></div></div>
          <div class="search-panel" id="searchPanel"><form id="siteSearchForm" role="search"><input id="siteSearch" type="search" placeholder="Search Utility Platform" aria-label="Search Utility Platform"><button type="submit">Search</button></form></div>
          <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"><a href="index.html">Home</a><a href="math-science.html">Math &amp; Science</a><a href="digital-developer.html">Digital &amp; Developer</a><a href="home-construction.html">Home &amp; Construction</a></nav></header>'''
          FOOTER = '''<footer><div class="footer-inner"><div class="footer-brand"><div class="footer-mark" aria-hidden="true">UP</div><div><strong>Utility Platform</strong><span>Practical online tools</span></div></div><nav class="footer-links" aria-label="Footer"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></div><div class="copyright">© 2026 Utility Platform</div></footer><script src="master-ui.js"></script>'''

          PAGE_INFO = {
              'time-calculator.html': ('math','time-tool','⏱','Time Calculator'),
              'pilot-hole-calculator.html': ('homec','pilot-tool','🔩','Pilot Hole Size Calculator'),
              'gravel-calculator.html': ('homec','gravel-tool','🪨','Gravel Calculator'),
              'uuid-generator-calculator.html': ('digital','uuid-tool','🧬','UUID Generator, Validator & Inspector'),
          }

          for page, rev in REFS.items():
              src = git_show(rev, page)
              head_match = re.search(r'<head>(.*?)</head>', src, re.S | re.I)
              body_match = re.search(r'<body[^>]*>(.*?)</body>', src, re.S | re.I)
              if not head_match or not body_match:
                  raise RuntimeError(f'Invalid source structure: {page}')
              head = head_match.group(1)
              body = body_match.group(1)

              # Keep SEO/structured data, remove conflicting legacy page CSS.
              head = re.sub(r'<style>.*?</style>', '', head, flags=re.S | re.I)
              head = re.sub(r'<link\b[^>]*rel=["\']stylesheet["\'][^>]*>', '', head, flags=re.I)
              head = re.sub(r'<link\b[^>]*href=["\'][^"\']+\.css[^"\']*["\'][^>]*>', '', head, flags=re.I)

              # Preserve all original non-JSON-LD body scripts after the new footer.
              scripts = re.findall(r'<script\b(?![^>]*type=["\']application/ld\+json["\'])[^>]*>.*?</script>', body, re.S | re.I)
              body = re.sub(r'<script\b(?![^>]*type=["\']application/ld\+json["\'])[^>]*>.*?</script>', '', body, flags=re.S | re.I)
              body = re.sub(r'<a\b[^>]*class=["\'][^"\']*(?:skip|skip-link)[^"\']*["\'][^>]*>.*?</a>', '', body, flags=re.S | re.I)
              body = re.sub(r'<header\b.*?</header>', '', body, flags=re.S | re.I)
              body = re.sub(r'<footer\b.*?</footer>', '', body, flags=re.S | re.I)
              body = re.sub(r'\sstyle=["\'][^"\']*["\']', '', body, flags=re.I)

              main_match = re.search(r'<main\b[^>]*>(.*?)</main>', body, re.S | re.I)
              if not main_match:
                  raise RuntimeError(f'Missing main: {page}')
              main_inner = main_match.group(1)

              # Remove legacy related-tool blocks; add only genuinely related links.
              main_inner = re.sub(r'<section\b[^>]*(?:class=["\'][^"\']*(?:related|related-tools)[^"\']*["\']|id=["\'][^"\']*related[^"\']*["\'])[^>]*>.*?</section>', '', main_inner, flags=re.S | re.I)

              # Build the master hero around the existing breadcrumb/title/lead structure.
              crumbs = re.search(r'<(?:div|p)\b[^>]*class=["\'][^"\']*(?:crumb|crumbs)[^"\']*["\'][^>]*>.*?</(?:div|p)>', main_inner, re.S | re.I)
              h1 = re.search(r'<h1\b[^>]*>(.*?)</h1>', main_inner, re.S | re.I)
              lead = re.search(r'<p\b[^>]*class=["\'][^"\']*lead[^"\']*["\'][^>]*>(.*?)</p>', main_inner, re.S | re.I)
              if not lead:
                  lead = re.search(r'<section\b[^>]*class=["\'][^"\']*hero[^"\']*["\'][^>]*>.*?<p\b[^>]*>(.*?)</p>.*?</section>', main_inner, re.S | re.I)
              if crumbs and h1:
                  title = h1.group(1).strip()
                  description = (lead.group(1).strip() if lead else '')
                  start = crumbs.start()
                  after = main_inner[crumbs.end():]
                  old_end = h1.end()
                  if lead:
                      lead_start_after = main_inner.find(lead.group(0), old_end)
                      old_end = lead.end() if lead_start_after >= 0 else old_end
                  # Drop an old hero wrapper when present; otherwise replace h1/lead only.
                  main_inner = main_inner[:start] + crumbs.group(0) + f'<section class="hero"><div class="tool-icon" aria-hidden="true">{PAGE_INFO[page][2]}</div><div><h1>{title}</h1><p>{description}</p></div></section>' + main_inner[old_end:]

              # Add a single main id used by the master skip link.
              main = '<main id="main-content">' + main_inner + '</main>'
              nav_mode, page_class, icon, title = PAGE_INFO[page]
              header = HEADER.replace('data-nav="'+nav_mode+'"', 'aria-current="page"')

              # Genuine Related Tools only.
              if page == 'pilot-hole-calculator.html':
                  main = main.replace('</main>', '<section class="card related-tools"><h2>Related Tools</h2><div class="related-grid"><a class="related-item" href="gravel-calculator.html"><div><strong>Gravel Calculator</strong><span>Plan aggregate quantities for home and construction projects.</span></div><span aria-hidden="true">›</span></a></div></section></main>')
              elif page == 'gravel-calculator.html':
                  main = main.replace('</main>', '<section class="card related-tools"><h2>Related Tools</h2><div class="related-grid"><a class="related-item" href="pilot-hole-calculator.html"><div><strong>Pilot Hole Size Calculator</strong><span>Choose practical wood-screw drill-bit starting sizes.</span></div><span aria-hidden="true">›</span></a></div></section></main>')

              head += '\n<link rel="stylesheet" href="master-tool-design.css">\n<style>body.'+page_class+'{ }'+PAGE_CSS[page]+'</style>\n'
              if page in ('pilot-hole-calculator.html','gravel-calculator.html'):
                  head += '<link rel="stylesheet" href="master-related-tools.css">\n'

              doc = '<!doctype html>\n<html lang="en">\n<head>\n' + head + '</head>\n<body class="tool-page '+page_class+'">\n' + header + '\n' + main + '\n' + FOOTER + '\n' + '\n'.join(scripts) + '\n</body>\n</html>\n'
              Path(page).write_text(doc, encoding='utf-8')

          print('Rebuilt:', ', '.join(REFS))
          PY

          rm -f .github/workflows/rebuild-four-tools.yml
          rm -f .rebuild-payload.b64 .rebuild-trigger .rebuild-part-* .github/workflows/install-rebuild-payload.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Rebuild four tools from locked master"
          git push origin HEAD:${{ github.head_ref }}
