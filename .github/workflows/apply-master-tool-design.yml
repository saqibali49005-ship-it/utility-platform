name: One-time master cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clean Significant Figures master page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('calculator.html')
          text = path.read_text(encoding='utf-8')
          original = text

          # The Significant Figures master is self-contained. Remove the
          # unused Related Tools stylesheet dependency so it cannot affect
          # this page or create a second CSS cascade.
          text = re.sub(
              r'\s*<link\s+rel=["\']stylesheet["\']\s+href=["\']master-related-tools\.css["\']\s*/?>',
              '', text, flags=re.I
          )

          # Lock the master footer alignment in its own CSS. No external
          # stylesheet should be responsible for the master page footer.
          text = text.replace(
              '.footer-inner{padding:20px 16px;flex-direction:column;align-items:flex-start}',
              '.footer-inner{padding:20px 16px;flex-direction:column;align-items:center}'
          )
          text = text.replace(
              '.copyright{text-align:left;padding-left:16px;padding-right:16px}',
              '.copyright{text-align:center;padding-left:16px;padding-right:16px}'
          )

          if text != original:
              path.write_text(text, encoding='utf-8')
              print('Master cleanup applied.')
          else:
              print('Master cleanup already applied.')
          PY

      - name: Commit final master lock
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculator.html
          if git diff --cached --quiet; then
            echo "No master changes to commit."
          else
            git commit -m "Finalize and lock calculator master"
            git push
          fi

      - name: Remove obsolete auto-override workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-master-tool-design.yml
          git commit -m "Remove obsolete master override workflow"
          git push
