name: Apply Master Tool Design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-master-design:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize every tool page to the master visual shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          link_pattern = re.compile(r'\s*<link\s+href=["\']master-(?:tool-design|related-tools)\.css["\']\s+rel=["\']stylesheet["\']\s*/?>', re.I)
          duplicate_header_style = re.compile(r'\s*<style>\s*/\*\s*MASTER HEADER\s+—\s+matches calculator\.html\s*\*/.*?</style>', re.I | re.S)

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if not re.search(r'<body[^>]*class=["\'][^"\']*\btool-page\b', text, re.I):
                  continue

              # Remove any accidental/legacy markup that was appended after
              # the document's closing html tag. It can override the master
              # CSS and produces invalid document structure.
              html_end = re.search(r'</html>\s*', text, re.I)
              if html_end:
                  cleaned = text[:html_end.end()]
              else:
                  cleaned = text

              # The master stylesheet is the single source of truth for the
              # shared header/navigation. Remove duplicated page-local copies.
              cleaned = duplicate_header_style.sub('', cleaned)

              # Remove old master links and reinsert them immediately before
              # </head>, making them the final CSS cascade layer.
              cleaned = link_pattern.sub('', cleaned)
              additions = (
                  '  <link href="master-tool-design.css" rel="stylesheet"/>\n'
                  '  <link href="master-related-tools.css" rel="stylesheet"/>'
              )
              new = re.sub(r'(</head>)', additions + '\n\\1', cleaned, count=1, flags=re.I)

              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.name)

          print('Master shell normalized:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit master-shell updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix malformed trailing styles in tool pages"
          git push
