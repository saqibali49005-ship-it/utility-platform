name: Apply Master Tool Design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-master-design:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add master design to every tool page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if not re.search(r'<body[^>]*class=["\'][^"\']*\btool-page\b', text, re.I):
                  continue
              if 'href="master-tool-design.css"' in text or "href='master-tool-design.css'" in text:
                  continue
              new = re.sub(
                  r'(</head>)',
                  '  <link href="master-tool-design.css" rel="stylesheet"/>\n\\1',
                  text,
                  count=1,
                  flags=re.I,
              )
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.name)

          print('Updated tool pages:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit master-design links
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Apply Time Calculator master design to tool pages"
          git push
