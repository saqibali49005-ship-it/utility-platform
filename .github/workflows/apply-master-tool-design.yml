name: Apply Master Tool Design

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-master-design:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Put master design modules last on every tool page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          changed = []
          link_pattern = re.compile(r'\s*<link\s+href=["\']master-(?:tool-design|related-tools)\.css["\']\s+rel=["\']stylesheet["\']\s*/?>', re.I)

          for path in sorted(Path('.').glob('*.html')):
              text = path.read_text(encoding='utf-8')
              if not re.search(r'<body[^>]*class=["\'][^"\']*\btool-page\b', text, re.I):
                  continue

              # Remove previous copies so the master modules are guaranteed
              # to be the final CSS cascade layer in <head>.
              cleaned = link_pattern.sub('', text)
              additions = (
                  '  <link href="master-tool-design.css" rel="stylesheet"/>\n'
                  '  <link href="master-related-tools.css" rel="stylesheet"/>'
              )
              new = re.sub(r'(</head>)', additions + '\n\\1', cleaned, count=1, flags=re.I)

              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(path.name)

          print('Master CSS final layer applied to:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit master-layer updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Phase 4: put master design last on tool pages"
          git push
