name: Rebuild four tools from locked master
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - name: Rebuild pages
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess

          def show(revpath):
              return subprocess.check_output(['git','show',revpath], text=True)

          def script_of(src):
              ms=list(re.finditer(r'<script>\s*(.*?)\s*</script>',src,re.S|re.I))
              return ms[-1].group(1).strip() if ms else ''

          # Use the approved Significant Figures Calculator CSS as the shared master.
          calc = Path('calculator.html').read_text(encoding='utf-8')
          css = re.search(r'<style>(.*?)</style>', calc, re.S|re.I).group(1).strip()
          Path('master-tool-design.css').write_text(css+'\n', encoding='utf-8')

          Path('master-related-tools.css').write_text('''/* Utility Platform — genuine Related Tools component only. */
          body.tool-page .related-tools,body.tool-page .related{width:100%;}
          body.tool-page .related-grid{width:100%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 0;padding:0}
          body.tool-page .related-item{min-width:0;min-height:76px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px 16px;border:1px solid #dbe3ed;border-radius:16px;background:#fff;color:#0b1220;text-decoration:none;box-shadow:0 5px 16px rgba(15,23,42,.05);transition:border-color .15s ease,box-shadow .15s ease,transform .15s ease}
          body.tool-page .related-item:hover{border-color:#bfdbfe;box-shadow:0 8px 18px rgba(15,23,42,.09);transform:translateY(-1px)}
          body.tool-page .related-item strong{display:block;margin:0;color:#0b1220;font-size:16px;line-height:1.25;font-weight:800}.related-item span{display:block;margin:3px 0 0;color:#64748b;font-size:13px;line-height:1.35}
          @media(max-width:650px){body.tool-page .related-grid{grid-template-columns:1fr}.related-item{min-height:72px;padding:13px 14px}}
          ''',encoding='utf-8')

          Path('master-ui.js').write_text('''(function(){'use strict';const m=document.getElementById('menuBtn'),n=document.getElementById('mobileNav'),s=document.getElementById('searchBtn'),p=document.getElementById('searchPanel'),i=document.getElementById('siteSearch'),f=document.getElementById('siteSearchForm');if(m&&n)m.onclick=()=>{const o=n.classList.toggle('open');m.setAttribute('aria-expanded',o);if(o&&p)p.classList.remove('open')};if(s&&p)s.onclick=()=>{const o=p.classList.toggle('open');s.setAttribute('aria-expanded',o);if(o&&i)i.focus();if(o&&n)n.classList.remove('open')};if(f&&i)f.onsubmit=e=>{e.preventDefault();const q=i.value.trim();if(q)location.href='index.html?search='+encodeURIComponent(q)}})();
''',encoding='utf-8')

          Path('MASTER-REFERENCE.md').write_text('''# Utility Platform — Master Design Reference\n\n## Status\n**Current Master — LOCKED**\n\nThe **Significant Figures Calculator** (`calculator.html`) is the official visual reference for the Utility Platform tool family.\n\nThe master covers the approved blue/white desktop and mobile visual language: header/navigation, search/menu controls, breadcrumbs, hero/title treatment, cards, forms, buttons, results, information sections, FAQ, responsive behavior and centered footer.\n\n## Architecture\n`master-tool-design.css` is the shared visual foundation for rebuilt tool pages. Shared styles are kept scoped to `.tool-page` where applicable so they do not leak into unrelated site pages. Page-specific CSS is allowed only for genuinely unique UI and must be narrowly scoped to that tool. No broad emergency overrides.\n\n## Related Tools\n`master-related-tools.css` is only for genuinely related tools. Empty space is acceptable; unrelated links are not.\n\n## Functionality\nRebuilding a tool must preserve its calculation logic, URLs, SEO metadata and core functionality unless explicitly requested otherwise.\n''',encoding='utf-8')

          header='''<a class="skip-link" href="#main-content">Skip to calculator</a>
          <header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><div class="brand-mark" aria-hidden="true">UP</div><div class="brand-copy"><strong>Utility Platform</strong><span>Smart Tools for a Smarter You</span></div></a>
          <nav class="top-nav" aria-label="Primary navigation"><a href="index.html" data-cur="home">Home</a><a href="math-science.html" data-cur="math">Math &amp; Science</a><a href="digital-developer.html" data-cur="digital">Digital &amp; Developer</a><a href="home-construction.html" data-cur="homec">Home &amp; Construction</a></nav>
          <div class="header-actions"><button class="icon-btn" id="searchBtn" type="button" aria-label="Search" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg></button><button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Open menu" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button></div></div>
          <div class="search-panel" id="searchPanel"><form id="siteSearchForm" role="search"><input id="siteSearch" type="search" placeholder="Search Utility Platform" aria-label="Search Utility Platform"><button type="submit">Search</button></form></div>
          <nav class="mobile-nav" id="mobileNav" aria-label="Mobile navigation"><a href="index.html" >Home</a><a href="math-science.html" data-cur="math">Math &amp; Science</a><a href="digital-developer.html" data-cur="digital">Digital &amp; Developer</a><a href="home-construction.html" data-cur="homec">Home &amp; Construction</a></nav></header>'''

          footer='''<footer><div class="footer-inner"><div class="footer-brand"><div class="footer-mark" aria-hidden="true">UP</div><div><strong>Utility Platform</strong><span>Practical online tools</span></div></div><nav class="footer-links" aria-label="Footer"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></div><div class="copyright">© 2026 Utility Platform</div></footer><script src="master-ui.js"></script>'''

          pages={
            'time-calculator.html':('867bbdc5cc3a5192fd1267cebd7e8119b535ade2','math','time-tool',r''' .time-tool .mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 18px;padding:4px;background:#f7fafe;border:1px solid #e0e9f3;border-radius:14px}.time-tool .mode-tabs button{width:100%;min-height:44px;padding:9px 14px;background:transparent;color:#4e6178;border:1px solid transparent;border-radius:10px;font-weight:850;cursor:pointer}.time-tool .mode-tabs button.active{background:linear-gradient(135deg,#1767e7,#19a9e8);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(23,104,231,.18)}.time-tool .check-row{display:flex;align-items:flex-start;gap:9px;margin:14px 0 0;color:var(--muted)}.time-tool .check-row input{width:auto;min-width:16px;min-height:0;margin:3px 0 0;padding:0}.time-tool #durationPanel>.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.time-tool #addPanel>.grid{grid-template-columns:repeat(5,minmax(0,1fr))}.time-tool .result-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:15px}.time-tool .result-grid>div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.time-tool .result-grid strong{display:block;font-size:20px;margin-top:4px}.time-tool .big{font-size:28px;font-weight:900;color:#116735}@media(max-width:820px){.time-tool #addPanel>.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.time-tool .mode-tabs{grid-template-columns:1fr}.time-tool #durationPanel>.grid,.time-tool #addPanel>.grid{grid-template-columns:1fr}.time-tool .result-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}'''),
            'pilot-hole-calculator.html':('c850f0a60dd33f471687f03ba86d39ec3be7133d^','homec','pilot-tool',r''' .pilot-tool .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pilot-tool .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.pilot-tool .kv div{background:#f7fbff;border:1px solid var(--line);border-radius:12px;padding:12px}.pilot-tool .note,.pilot-tool .warn{padding:13px 14px;border-radius:12px;margin-top:10px}.pilot-tool .note{border:1px solid #c9ecd8;background:#f2fff7}.pilot-tool .warn{border:1px solid #f2d28e;background:#fff9e9;color:#7a4a00}.pilot-tool .source-list{padding-left:20px}.pilot-tool .source-list li{margin:5px 0}.pilot-tool .result{background:linear-gradient(180deg,#fbfffd,#f2fff7)}@media(max-width:650px){.pilot-tool .grid,.pilot-tool .kv{grid-template-columns:1fr}}'''),
            'gravel-calculator.html':('b6ad8e32ceb34b2b20098d1b81f7317746355888^','homec','gravel-tool',r''' .gravel-tool .toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}.gravel-tool .preset-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.gravel-tool .preset{border:1px solid #d8e5f3;background:#fff;color:#2c557e;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:800;cursor:pointer}.gravel-tool .section-list{display:grid;gap:12px}.gravel-tool .area-card{border:1px solid var(--line);border-radius:14px;padding:14px;background:#f7fbff}.gravel-tool .area-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.gravel-tool .area-title{font-weight:800}.gravel-tool .remove{border:1px solid #d8e5f3;background:#fff;color:var(--muted);border-radius:9px;padding:7px 9px;font-weight:800;cursor:pointer}.gravel-tool .area-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.gravel-tool .shape-extra{display:none}.gravel-tool .area-card[data-shape="circle"] .rect-only,.gravel-tool .area-card[data-shape="triangle"] .rect-only{display:none}.gravel-tool .area-card[data-shape="circle"] .circle-only,.gravel-tool .area-card[data-shape="triangle"] .triangle-only{display:block}.gravel-tool .area-card[data-shape="rectangle"] .rect-only{display:block}.gravel-tool .results{display:grid;gap:10px}.gravel-tool .result-main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.gravel-tool .result-main>.result{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px}.gravel-tool .result .value{font-size:24px;font-weight:900;margin-top:4px}.gravel-tool .order-box{background:#f6fbff;border:1px solid var(--line);border-radius:13px;padding:14px}.gravel-tool .order-box strong{font-size:19px}.gravel-tool .sub-results{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:10px}.gravel-tool .alert{display:none;margin-top:12px;padding:11px 12px;border-radius:10px;border:1px solid #f2c46d;background:#fff8e8;color:#854d0e;font-size:14px}.gravel-tool .alert.show{display:block}.gravel-tool .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.gravel-tool .formula{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#0f172a;color:#fff;border-radius:10px;padding:12px;overflow:auto;font-size:13px}.gravel-tool .warning{font-size:13px;color:var(--muted)}@media(max-width:900px){.gravel-tool .area-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.gravel-tool .result-main{grid-template-columns:repeat(2,minmax(0,1fr))}.gravel-tool .sub-results{grid-template-columns:1fr 1fr}}@media(max-width:650px){.gravel-tool .toolbar,.gravel-tool .info-grid{grid-template-columns:1fr}.gravel-tool .area-grid{grid-template-columns:1fr}.gravel-tool .result-main,.gravel-tool .sub-results{grid-template-columns:1fr 1fr}}@media(max-width:430px){.gravel-tool .result-main,.gravel-tool .sub-results{grid-template-columns:1fr}}'''),
            'uuid-generator-calculator.html':('97c1929e81cac1d34673f958ec0d6efafa1d2350^','digital','uuid-tool',r''' .uuid-tool .controls{grid-template-columns:repeat(2,minmax(0,1fr))}.uuid-tool .seg{display:flex;gap:8px;flex-wrap:wrap}.uuid-tool .seg button{border:1px solid #d8e5f3;background:#fff;color:#2c557e;border-radius:999px;padding:9px 13px;font-weight:800;cursor:pointer}.uuid-tool .seg button.active{background:linear-gradient(135deg,#1767e7,#19a9e8);color:#fff;border-color:transparent}.uuid-tool .item{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.uuid-tool .item button{min-height:40px;padding:8px 11px}.uuid-tool .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;word-break:break-all}.uuid-tool .mini{font-size:.82rem;color:var(--muted)}.uuid-tool .callout{border-left:3px solid var(--primary);padding:12px 14px;background:#f4f8fd;border-radius:8px;margin-top:14px;color:#334b67}.uuid-tool .callout.warn{border-left-color:#b45309;background:#fff8ea}.uuid-tool .status.ok{color:#168546}.uuid-tool .status.err{color:#b42318}@media(max-width:700px){.uuid-tool .controls{grid-template-columns:1fr}.uuid-tool .stats{grid-template-columns:1fr}.uuid-tool .item{align-items:stretch;flex-direction:column}.uuid-tool .item button{width:max-content}}''')}

          for page,(rev,current,cls,pcss) in pages.items():
              src=show(rev+':'+page)
              head=src[src.index('<head>')+6:src.index('</head>')]
              head=re.sub(r'<style>.*?</style>','',head,flags=re.S|re.I)
              head=re.sub(r'<link[^>]*rel=["\']stylesheet["\'][^>]*>','',head,flags=re.I)
              a=src.index('<main'); b=src.index('</main>',a)+7; main=src[a:b]
              main=re.sub(r'<main[^>]*>','<main id="main-content">',main,count=1,flags=re.I)
              main=re.sub(r'\sstyle="[^"]*"','',main,flags=re.I)
              if '<section class="hero">' not in main.lower():
                  mm=re.search(r'(<div class="crumb"[^>]*>.*?</div>\s*)(<h1>.*?</h1>\s*<p class="lead">.*?</p>)',main,re.S|re.I)
                  if mm:
                      title=re.search(r'<h1>(.*?)</h1>',mm.group(2),re.S|re.I).group(1); lead=re.search(r'<p class="lead">(.*?)</p>',mm.group(2),re.S|re.I).group(1)
                      icon='🔩' if page.startswith('pilot') else ('🪨' if page.startswith('gravel') else ('🧬' if page.startswith('uuid') else '⏱'))
                      main=main[:mm.start(2)]+f'<section class="hero"><div class="tool-icon" aria-hidden="true">{icon}</div><div><h1>{title}</h1><p>{lead}</p></div></section>'+main[mm.end(2):]
              if page=='pilot-hole-calculator.html':
                  main=re.sub(r'<section class="card">\s*<h2>Related[^<]*</h2>.*?</section>','<section class="card related-tools"><h2>Related Tools</h2><div class="related-grid"><a class="related-item" href="gravel-calculator.html"><div><strong>Gravel Calculator</strong><span>Plan aggregate quantities for home and construction projects.</span></div><span aria-hidden="true">›</span></a></div></section>',main,flags=re.S|re.I)
              elif page=='gravel-calculator.html':
                  main=re.sub(r'<section class="panel">\s*<h2>Related tools</h2>.*?</section>','<section class="panel related-tools"><h2>Related Tools</h2><div class="related-grid"><a class="related-item" href="pilot-hole-calculator.html"><div><strong>Pilot Hole Size Calculator</strong><span>Choose practical wood-screw drill-bit starting sizes.</span></div><span aria-hidden="true">›</span></a></div></section>',main,flags=re.S|re.I)
              elif page=='uuid-generator-calculator.html':
                  main=re.sub(r'<section class="card">\s*<h2>Related tools</h2>.*?</section>','',main,flags=re.S|re.I)
              elif page=='time-calculator.html':
                  main=re.sub(r'<section class="card related">.*?</section>','',main,flags=re.S|re.I)
              h=head+'\n<link rel="stylesheet" href="master-tool-design.css">\n<style>'+pcss+'</style>\n'
              if page in ('pilot-hole-calculator.html','gravel-calculator.html'): h+='<link rel="stylesheet" href="master-related-tools.css">\n'
              if current=='math': hdr=header.replace('data-cur="math"','aria-current="page"').replace('data-cur="digital"','').replace('data-cur="homec"','')
              elif current=='digital': hdr=header.replace('data-cur="digital"','aria-current="page"').replace('data-cur="math"','').replace('data-cur="homec"','')
              else: hdr=header.replace('data-cur="homec"','aria-current="page"').replace('data-cur="math"','').replace('data-cur="digital"','')
              doc='<!doctype html>\n<html lang="en">\n<head>\n'+h+'</head>\n<body class="tool-page '+cls+'">\n'+hdr+'\n'+main+'\n'+footer+'\n<script>\n'+script_of(src)+'\n</script>\n</body>\n</html>\n'
              Path(page).write_text(doc,encoding='utf-8')

          print('Rebuilt:', ', '.join(pages))
          PY
      - name: Remove this one-time workflow and commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/rebuild-four-tools.yml
          git add time-calculator.html pilot-hole-calculator.html gravel-calculator.html uuid-generator-calculator.html master-tool-design.css master-related-tools.css master-ui.js MASTER-REFERENCE.md
          git commit -m "Rebuild four tools from locked master design"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
