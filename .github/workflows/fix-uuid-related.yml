name: Fix UUID Related Tools UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply UUID-only Related Tools fix
        shell: python
        run: |
          from pathlib import Path
          p = Path('site-design.css')
          css = p.read_text(encoding='utf-8')
          marker = '/* UUID-only Related Tools separator fix */'
          if marker not in css:
              css += r'''

          /* UUID-only Related Tools separator fix */
          main.wrap:has(> .crumbs > a[href="digital-developer.html"]) > section.card:last-of-type:has(a[href="pilot-hole-calculator.html"]) p{
            display:flex!important;
            flex-wrap:wrap!important;
            gap:10px!important;
            margin:0!important;
            font-size:0!important;
          }
          main.wrap:has(> .crumbs > a[href="digital-developer.html"]) > section.card:last-of-type:has(a[href="pilot-hole-calculator.html"]) p>a{
            flex:1 1 calc(50% - 5px)!important;
            width:auto!important;
            min-width:0!important;
            min-height:68px!important;
            box-sizing:border-box!important;
            display:grid!important;
            grid-template-columns:42px minmax(0,1fr) 18px!important;
            align-items:center!important;
            column-gap:11px!important;
            margin:0!important;
            padding:9px 12px 9px 64px!important;
            border:1px solid #dbe3ed!important;
            border-radius:14px!important;
            background:#fff!important;
            color:var(--up-text)!important;
            text-decoration:none!important;
            font-size:14px!important;
            line-height:1.3!important;
            font-weight:800!important;
            box-shadow:0 4px 14px rgba(15,23,42,.045)!important;
            overflow:hidden!important;
          }
          @media(max-width:700px){
            main.wrap:has(> .crumbs > a[href="digital-developer.html"]) > section.card:last-of-type:has(a[href="pilot-hole-calculator.html"]) p>a{
              flex-basis:100%!important;
              min-height:64px!important;
              grid-template-columns:40px minmax(0,1fr) 18px!important;
              padding:8px 10px 8px 61px!important;
              border-radius:13px!important;
            }
          }
          '''
              p.write_text(css, encoding='utf-8')
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-uuid-related.yml
          git add site-design.css .github/workflows/fix-uuid-related.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix UUID Related Tools card spacing"
          git push
