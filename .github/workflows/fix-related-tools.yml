name: Repair Related Tools UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair Related Tools CSS
        shell: python
        run: |
          from pathlib import Path
          p = Path('site-design.css')
          css = p.read_text(encoding='utf-8')

          marker = '/* Final Related Tools visual repair - all tool pages */'
          if marker not in css:
              css += r'''

          /* Final Related Tools visual repair - all tool pages */
          .related{
            display:block!important;
            width:100%!important;
            min-width:0!important;
            box-sizing:border-box!important;
            margin-top:16px!important;
          }
          .related > h2{
            margin:0 0 14px!important;
          }
          .related > .related-grid{
            display:grid!important;
            grid-template-columns:repeat(2,minmax(0,1fr))!important;
            gap:12px!important;
            width:100%!important;
            margin:0!important;
          }
          .related > .related-item,
          .related > a{
            position:relative!important;
            width:100%!important;
            min-width:0!important;
            min-height:68px!important;
            box-sizing:border-box!important;
            display:grid!important;
            grid-template-columns:42px minmax(0,1fr) 18px!important;
            align-items:center!important;
            column-gap:11px!important;
            padding:9px 12px!important;
            margin:0!important;
            border:1px solid #dbe3ed!important;
            border-radius:14px!important;
            background:#fff!important;
            color:var(--up-text)!important;
            text-decoration:none!important;
            box-shadow:0 4px 14px rgba(15,23,42,.045)!important;
            overflow:hidden!important;
          }
          .related > .related-item strong{
            grid-column:2!important;
            grid-row:1!important;
            margin:0!important;
            min-width:0!important;
            font-size:14px!important;
            line-height:1.25!important;
            overflow-wrap:anywhere!important;
          }
          .related > .related-item span{
            grid-column:2!important;
            grid-row:2!important;
            min-width:0!important;
            font-size:12px!important;
            line-height:1.3!important;
            color:#64748b!important;
            overflow-wrap:anywhere!important;
          }
          .related > .related-item::before,
          .related > a::before{
            grid-column:1!important;
            grid-row:1 / span 2!important;
            width:42px!important;
            height:42px!important;
            display:grid!important;
            place-items:center!important;
            border-radius:12px!important;
            font-size:20px!important;
            line-height:1!important;
            font-weight:700!important;
            box-sizing:border-box!important;
            color:#1d4ed8!important;
            background:#eff6ff!important;
          }
          .related > .related-item::after,
          .related > a::after{
            content:"›"!important;
            grid-column:3!important;
            grid-row:1 / span 2!important;
            align-self:center!important;
            justify-self:end!important;
            font-size:25px!important;
            line-height:1!important;
            color:#0f172a!important;
          }
          .related > .related-item:nth-child(1)::before,
          .related > a:nth-child(1)::before{content:"▦"!important}
          .related > .related-item:nth-child(2)::before,
          .related > a:nth-child(2)::before{content:"⚖"!important;color:#15803d!important;background:#ecfdf5!important}
          .related > .related-item:nth-child(3)::before,
          .related > a:nth-child(3)::before{content:"▤"!important;color:#7c3aed!important;background:#f5f3ff!important}
          .related > .related-item:nth-child(4)::before,
          .related > a:nth-child(4)::before{content:"◷"!important;color:#0891b2!important;background:#ecfeff!important}
          .related > .related-item:nth-child(5)::before,
          .related > a:nth-child(5)::before{content:"⌁"!important;color:#c2410c!important;background:#fff7ed!important}

          main>section.card:last-of-type p:has(> a:nth-of-type(2)){
            display:grid!important;
            grid-template-columns:repeat(2,minmax(0,1fr))!important;
            gap:12px!important;
            margin:0!important;
          }
          main>section.card:last-of-type p:has(> a:nth-of-type(2))>a,
          main>section.card:last-of-type p>a:only-child{
            position:relative!important;
            width:100%!important;
            min-width:0!important;
            min-height:68px!important;
            box-sizing:border-box!important;
            display:grid!important;
            grid-template-columns:42px minmax(0,1fr) 18px!important;
            align-items:center!important;
            column-gap:11px!important;
            margin:0!important;
            padding:9px 12px 9px 64px!important;
            border:1px solid #dbe3ed!important;
            border-radius:14px!important;
            background:#fff!important;
            color:var(--up-text)!important;
            text-decoration:none!important;
            font-size:14px!important;
            line-height:1.3!important;
            box-shadow:0 4px 14px rgba(15,23,42,.045)!important;
            overflow:hidden!important;
          }
          main>section.card:last-of-type p:has(> a:nth-of-type(2))>a::before,
          main>section.card:last-of-type p>a:only-child::before{
            position:absolute!important;
            left:11px!important;
            top:50%!important;
            transform:translateY(-50%)!important;
            width:42px!important;
            height:42px!important;
            display:grid!important;
            place-items:center!important;
            border-radius:12px!important;
            font-size:20px!important;
            line-height:1!important;
            font-weight:700!important;
            box-sizing:border-box!important;
            color:#1d4ed8!important;
            background:#eff6ff!important;
          }
          main>section.card:last-of-type p:has(> a:nth-of-type(2))>a::after,
          main>section.card:last-of-type p>a:only-child::after{
            content:"›"!important;
            position:absolute!important;
            right:11px!important;
            top:50%!important;
            transform:translateY(-52%)!important;
            font-size:25px!important;
            line-height:1!important;
            color:#0f172a!important;
          }
          main>section.card:last-of-type p:has(> a:nth-of-type(2))>a:nth-child(1)::before,
          main>section.card:last-of-type p>a:only-child::before{content:"▦"!important}
          main>section.card:last-of-type p:has(> a:nth-of-type(2))>a:nth-child(2)::before{content:"⌁"!important;color:#c2410c!important;background:#fff7ed!important}

          @media(max-width:700px){
            .related > .related-grid{grid-template-columns:1fr!important;gap:10px!important}
            .related > .related-item,
            .related > a{
              min-height:64px!important;
              grid-template-columns:40px minmax(0,1fr) 18px!important;
              padding:8px 10px!important;
              column-gap:10px!important;
              border-radius:13px!important;
            }
            .related > .related-item::before,
            .related > a::before{
              width:40px!important;height:40px!important;border-radius:11px!important;font-size:19px!important;
            }
            main>section.card:last-of-type p:has(> a:nth-of-type(2)){
              grid-template-columns:1fr!important;
              gap:10px!important;
            }
            main>section.card:last-of-type p:has(> a:nth-of-type(2))>a,
            main>section.card:last-of-type p>a:only-child{
              min-height:64px!important;
              padding:8px 10px 8px 61px!important;
              grid-template-columns:40px minmax(0,1fr) 18px!important;
              border-radius:13px!important;
            }
            main>section.card:last-of-type p:has(> a:nth-of-type(2))>a::before,
            main>section.card:last-of-type p>a:only-child::before{
              left:10px!important;width:40px!important;height:40px!important;border-radius:11px!important;font-size:19px!important;
            }
          }
          '''
              p.write_text(css, encoding='utf-8')

      - name: Commit repair and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-related-tools.yml
          git add site-design.css .github/workflows/fix-related-tools.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix Related Tools layout across tool pages"
          git push