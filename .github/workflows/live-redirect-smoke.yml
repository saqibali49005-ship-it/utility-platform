name: Live Redirect Smoke Test

on:
  push:
    branches: [main]
  schedule:
    - cron: '25 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zemtools-live-smoke
  cancel-in-progress: true

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test live redirects, canonical page, robots and sitemap
        run: node scripts/validate-live-redirects.mjs
