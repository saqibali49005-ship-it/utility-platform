name: Apply Master Tool Header
on:
  push:
    paths:
      - '_apply_master_header.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add master header stylesheet to every tool page
        shell: bash
        run: |
          set -e
          changed=0
          while IFS= read -r -d '' file; do
            if ! grep -q 'master-tool-header.css' "$file"; then
              python3 - "$file" <<'PY'
import sys
from pathlib import Path
p=Path(sys.argv[1])
s=p.read_text()
if '</head>' not in s.lower():
    raise SystemExit(f'No </head> in {p}')
pos=s.lower().find('</head>')
s=s[:pos]+'<link href="master-tool-header.css" rel="stylesheet"/>'+s[pos:]
p.write_text(s)
PY
              changed=1
            fi
          done < <(find . -type f -name '*.html' -print0 | while IFS= read -r -d '' f; do grep -q 'tool-page' "$f" && printf '%s\0' "$f"; done)
          if [ "$changed" -eq 1 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add '*.html'
            git commit -m 'Apply calculator header style to all tool pages'
            git push
          fi
