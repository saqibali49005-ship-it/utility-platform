name: Apply Master Tool Header
on:
  push:
    paths:
      - '_apply_master_header.txt'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch header CSS
        run: |
          cat >> site-design.css <<'CSS'

/* MASTER HEADER: calculator.html reference */
.tool-page > header .header-inner{max-width:980px!important;margin:0 auto!important;padding:18px 16px!important;display:block!important}
.tool-page > header .brand{display:flex!important;align-items:center!important;justify-content:center!important;gap:10px!important;margin:0!important;padding:0!important;color:#111827!important;font-size:16px!important;line-height:1.2!important;font-weight:800!important;text-decoration:none!important;white-space:nowrap!important}
.tool-page > header .brand-mark{width:34px!important;height:34px!important;flex:0 0 34px!important;display:grid!important;place-items:center!important;border-radius:9px!important;background:#111827!important;color:#fff!important;font-size:17px!important;line-height:1!important;box-shadow:none!important}
.tool-page > header .nav,.tool-page > header .top-nav{width:100%!important;display:flex!important;align-items:center!important;justify-content:center!important;gap:18px!important;margin:0!important;padding:0 16px 16px!important;border:0!important;border-radius:0!important;background:transparent!important;box-shadow:none!important;flex-wrap:wrap!important;overflow:visible!important;white-space:normal!important}
.tool-page > header .nav a,.tool-page > header .top-nav a{flex:0 0 auto!important;display:inline!important;padding:0!important;margin:0!important;border:0!important;border-radius:0!important;background:transparent!important;color:#5b6472!important;font-size:14px!important;line-height:1.55!important;font-weight:700!important;text-decoration:none!important;white-space:nowrap!important;box-shadow:none!important}
@media(max-width:650px){.tool-page > header .nav,.tool-page > header .top-nav{justify-content:center!important;gap:14px!important;padding:0 8px 16px!important;overflow-x:auto!important;flex-wrap:nowrap!important;scrollbar-width:none!important}.tool-page > header .nav::-webkit-scrollbar,.tool-page > header .top-nav::-webkit-scrollbar{display:none!important}}
CSS
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site-design.css
          git diff --cached --quiet || git commit -m 'Make tool headers consistent with calculator'
          git push
