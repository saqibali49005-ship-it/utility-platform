name: Apply Master Tool Header
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply calculator header style to all tool pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = '''
          /* MASTER HEADER — matches calculator.html */
          .tool-page > header.site-header,
          .tool-page > header.site-header .header-inner {
            box-sizing:border-box!important;
          }
          .tool-page > header.site-header {
            position:static!important;
            width:100%!important;
            background:#fff!important;
            border-bottom:1px solid #d9dee6!important;
            box-shadow:none!important;
            backdrop-filter:none!important;
          }
          .tool-page > header.site-header .header-inner {
            max-width:980px!important;
            margin:0 auto!important;
            padding:18px 16px!important;
            min-height:0!important;
            display:block!important;
          }
          .tool-page > header.site-header .brand {
            display:flex!important;
            align-items:center!important;
            justify-content:center!important;
            gap:10px!important;
            margin:0!important;
            padding:0!important;
            color:#111827!important;
            font-size:16px!important;
            line-height:1.2!important;
            font-weight:800!important;
            letter-spacing:-.2px!important;
            text-decoration:none!important;
            white-space:nowrap!important;
          }
          .tool-page > header.site-header .brand-mark {
            width:34px!important;height:34px!important;flex:0 0 34px!important;
            display:grid!important;place-items:center!important;
            border-radius:9px!important;background:#111827!important;color:#fff!important;
            font-size:17px!important;line-height:1!important;box-shadow:none!important;
          }
          .tool-page > header.site-header .top-nav {
            width:100%!important;
            display:flex!important;
            align-items:center!important;
            justify-content:center!important;
            gap:18px!important;
            margin:0!important;
            padding:0 16px 16px!important;
            border:0!important;
            border-radius:0!important;
            background:transparent!important;
            box-shadow:none!important;
            flex-wrap:wrap!important;
            overflow:visible!important;
            white-space:normal!important;
            font-size:14px!important;
            font-weight:700!important;
          }
          .tool-page > header.site-header .top-nav a {
            flex:0 0 auto!important;
            display:inline!important;
            min-height:0!important;
            padding:0!important;
            margin:0!important;
            border:0!important;
            border-radius:0!important;
            background:transparent!important;
            color:#5b6472!important;
            font-size:14px!important;
            line-height:1.55!important;
            font-weight:700!important;
            text-decoration:none!important;
            white-space:nowrap!important;
            box-shadow:none!important;
          }
          .tool-page > header.site-header .top-nav a:hover,
          .tool-page > header.site-header .top-nav a[aria-current="page"] {
            background:transparent!important;
            border:0!important;
            color:#5b6472!important;
            box-shadow:none!important;
            text-decoration:none!important;
          }
          @media(max-width:650px){
            .tool-page > header.site-header .top-nav {
              justify-content:center!important;gap:14px!important;padding:0 8px 16px!important;
              overflow-x:auto!important;flex-wrap:nowrap!important;scrollbar-width:none!important;
            }
            .tool-page > header.site-header .top-nav::-webkit-scrollbar{display:none!important}
          }
          '''
          marker='/* MASTER HEADER — matches calculator.html */'
          for p in Path('.').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              if 'class="tool-page"' not in s or marker in s:
                  continue
              s=s.replace('</head>', '<style>'+css+'</style>\n</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add '*.html'
          git diff --cached --quiet || git commit -m 'Standardize tool page headers to calculator'
          git push