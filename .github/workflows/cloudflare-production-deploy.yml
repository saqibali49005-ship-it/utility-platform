name: Cloudflare Worker Config Validation (No Production Deployment)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Wrangler configuration and asset manifest
        run: npx --yes wrangler@4 deploy --dry-run --config wrangler.jsonc

# The current public production origin is GitHub Pages behind Cloudflare proxy DNS.
# The Cloudflare Worker has no route or custom domain for zemtools.com, so this
# workflow intentionally performs validation only. Do not add a production
# deployment here until the origin/route design is explicitly approved.
