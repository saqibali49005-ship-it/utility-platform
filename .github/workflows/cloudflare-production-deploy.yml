name: Cloudflare Production Deploy

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm that the approved commit should be deployed to zemtools.com"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zemtools-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Check out approved commit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy static assets to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          npx --yes wrangler@4 deploy --config wrangler.jsonc

      - name: Verify live site redirects, canonical page, robots and sitemap
        run: node scripts/validate-live-redirects.mjs
