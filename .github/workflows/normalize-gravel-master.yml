name: Normalize Gravel Master
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Normalize gravel page
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('gravel-calculator.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<style\s+id=["\']gravel-header-final-size-align["\'][\s\S]*?</style>\s*', '', s, count=1)
          s = re.sub(r'\s*<link[^>]+href=["\']master-related-tools\.css["\'][^>]*>', '', s, count=1)
          s = re.sub(r'\s*<section[^>]*class=["\']card related-tools["\'][\s\S]*?Pilot Hole Size Calculator[\s\S]*?</section>', '', s, count=1)
          s = re.sub(r'(</section>\s*)<p>Plan the amount of gravel you need[\s\S]*?</p>\s*</section>', r'\1', s, count=1)
          s = s.replace('meta content="#111827" name="theme-color"', 'meta content="#0b2f66" name="theme-color"')
          s = s.replace('body.gravel-tool{ }', '')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gravel-calculator.html
          git add -u .github/workflows/normalize-gravel-master.yml .rebuild-gravel-trigger
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Align gravel calculator with locked master"
          git push
