name: Foundation Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-foundation.mjs
      - name: Install Playwright
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local site
        run: |
          python3 -m http.server 4173 --directory . > /tmp/zemtools-http.log 2>&1 &
          echo $! > /tmp/zemtools-http.pid
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4173/fence-calculator/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/zemtools-http.log
          exit 1
      - name: Run fence calculator browser regression tests
        run: node tests/fence-calculator.browser.mjs
      - name: Run wire-size calculator browser regression tests
        run: node tests/wire-size-calculator.browser.mjs
      - name: Run conduit-fill calculator browser regression tests
        run: node tests/conduit-fill-calculator.browser.mjs
      - name: Run gravel calculator browser regression tests
        run: node tests/gravel-calculator.browser.mjs
      - name: Run significant-figures browser regression tests
        run: node tests/significant-figures.browser.mjs
      - name: Run paver edge restraint browser regression tests
        run: node tests/paver-edge-restraint.browser.mjs
      - name: Run deck joist blocking browser regression tests
        run: node tests/deck-joist-blocking.browser.mjs
      - name: Run sod staple browser regression tests
        run: node tests/sod-staple.browser.mjs
      - name: Run paint calculator browser regression tests
        run: node tests/paint-calculator.browser.mjs
      - name: Run business-hours calculator browser regression tests
        run: node tests/business-hours-calculator.browser.mjs
