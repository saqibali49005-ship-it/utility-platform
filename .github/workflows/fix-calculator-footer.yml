name: Fix calculator footer
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize calculator footer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('calculator.html')
          s = p.read_text(encoding='utf-8')
          footer = '''<footer><div class="footer-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></footer>'''
          s2, n = re.subn(r'<footer[\\s\\S]*?</footer>', footer, s, count=1)
          if n != 1:
              raise SystemExit('Calculator footer block not found; refusing to change the page.')
          if s2 == s:
              raise SystemExit('No footer change needed.')
          p.write_text(s2, encoding='utf-8')
          PY
      - name: Commit calculator footer fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add calculator.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix calculator footer to approved reference layout"
          git push
      - name: Remove one-shot workflow
        if: always()
        run: |
          git rm -f .github/workflows/fix-calculator-footer.yml || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary calculator footer workflow" || true
          git push || true